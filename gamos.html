      TESSELLATED: '4 3 0. 0. 0. 20. 0. 0. 0. 20. 0. 0 3 0. 0. 0. 20. 0. 0. 0. 0. 20. 0 3 0. 0. 0. 0. 20. 0. 0. 0. 20. 0 3 20. 0. 0. 0. 20. 0. 0. 0. 20. 0'
    };
    const TG_COLOURS = ['0.6 0.8 1.0', '1.0 0.55 0.0', '0.5 1.0 0.0', '1.0 0.0 1.0', '1.0 1.0 0.0', '0.93 0.51 0.93', '0.53 0.81 0.92', '1.0 0.75 0.8'];
    const IGNORED_TAGS = new Set([':ELEM', ':ISOT', ':ELEM_FROM_ISOT', ':MATE', ':MIXT', ':MIXT_BY_WEIGHT', ':MIXT_BY_VOLUME',
      ':MIXT_BY_NATOMS', ':MATE_MEE', ':MATE_STATE', ':MATE_TEMPERATURE', ':MATE_PRESSURE', ':CHECK_OVERLAPS', ':PS']);

    let gamosNames = { logicals: [], solids: [], rotms: [], world: 'world', placed: [] };

    function tgWords(line) {
      const words = [];
      const re = /"([^"]*)"|(\S+)/g;
      let m;
      while ((m = re.exec(line))) words.push(m[1] !== undefined ? m[1] : m[2]);
      return words;
    }

    function readTextRecords(text) {
      const records = [];
      let cur = null;
      text.split(/\r?\n/).forEach((raw, i) => {
        const cut = raw.indexOf('//');
        const line = (cut >= 0 ? raw.slice(0, cut) : raw).trim();
        if (!line) return;
        const words = tgWords(line);
        if (line.startsWith(':')) {
          cur = { tag: words[0].toUpperCase(), words: words.slice(1), line: i + 1 };
          records.push(cur);
        } else if (/^#include/i.test(line)) {
          records.push({ tag: '#INCLUDE', words: words.slice(1), line: i + 1 });
          cur = null;
        } else if (cur) {
          cur.words.push(...words);   // continuation of the previous tag
        } else {
          records.push({ tag: '?', words, line: i + 1 });
        }
      });
      return records;
    }

    // Text-format solid (type + numbers in Geant4 internal units) -> viewer solid parameters
    function mapTextSolid(type, v) {
      const need = n => {
        if (v.length !== n) throw new Error(`${type} needs ${n} parameters (${TG_PARAM_NAMES[type].join(' ')}), found ${v.length}`);
      };
      switch (type) {
        case 'BOX': need(3); return { Type: 'TsBox', HLX: v[0], HLY: v[1], HLZ: v[2] };
        case 'TUBE': need(3); return { Type: 'TsCylinder', RMin: v[0], RMax: v[1], HL: v[2] };
        case 'TUBS': need(5); return { Type: 'TsCylinder', RMin: v[0], RMax: v[1], HL: v[2], SPhi: v[3], DPhi: v[4] };
        case 'CONE': need(5); return { Type: 'G4Cons', RMin1: v[0], RMax1: v[1], RMin2: v[2], RMax2: v[3], HL: v[4] };
        case 'CONS': need(7); return { Type: 'G4Cons', RMin1: v[0], RMax1: v[1], RMin2: v[2], RMax2: v[3], HL: v[4], SPhi: v[5], DPhi: v[6] };
        case 'PARA': need(6); return { Type: 'G4Para', HLX: v[0], HLY: v[1], HLZ: v[2], Alpha: v[3], Theta: v[4], Phi: v[5] };
        case 'TRD': need(5); return { Type: 'G4Trd', HLX1: v[0], HLX2: v[1], HLY1: v[2], HLY2: v[3], HLZ: v[4] };
        case 'TRAP':
          if (v.length === 11) return { Type: 'G4GTrap', HLZ: v[0], Theta: v[1], Phi: v[2], HLY1: v[3], HLX1: v[4], HLX2: v[5],
                                        Alp1: v[6], HLY2: v[7], HLX3: v[8], HLX4: v[9], Alp2: v[10] };
          if (v.length === 4) return { Type: 'G4RTrap', LZ: v[0], LY: v[1], LX: v[2], LTX: v[3] };
          throw new Error(`TRAP needs 11 parameters (${TG_PARAM_NAMES.TRAP.join(' ')}) or 4 (pz py px pltx), found ${v.length}`);
        case 'SPHERE': need(6); return { Type: 'TsSphere', RMin: v[0], RMax: v[1], SPhi: v[2], DPhi: v[3], STheta: v[4], DTheta: v[5] };
        case 'ORB': need(1); return { Type: 'G4Orb', R: v[0] };
        case 'TORUS': need(5); return { Type: 'G4Torus', RMin: v[0], RMax: v[1], RTor: v[2], SPhi: v[3], DPhi: v[4] };
        case 'POLYCONE': {
          const n = Math.round(v[2]), z = [], a = [], b = [];
          if (v.length === 3 + 3 * n) {
            for (let i = 0; i < n; i++) { z.push(v[3 + 3 * i]); a.push(v[4 + 3 * i]); b.push(v[5 + 3 * i]); }
            return { Type: 'G4HPolycone', PhiStart: v[0], PhiTotal: v[1], Z: z, RInner: a, ROuter: b };
          }
          if (v.length === 3 + 2 * n) {
            for (let i = 0; i < n; i++) { a.push(v[3 + 2 * i]); z.push(v[4 + 2 * i]); }
            return { Type: 'G4SPolycone', PhiStart: v[0], PhiTotal: v[1], R: a, Z: z };
          }
          throw new Error(`POLYCONE with ${n} planes needs ${3 + 3 * n} (z rmin rmax) or ${3 + 2 * n} (r z) parameters, found ${v.length}`);
        }
        case 'POLYHEDRA': {
          const sides = Math.round(v[2]), n = Math.round(v[3]), z = [], a = [], b = [];
          if (v.length === 4 + 3 * n) {
            for (let i = 0; i < n; i++) { z.push(v[4 + 3 * i]); a.push(v[5 + 3 * i]); b.push(v[6 + 3 * i]); }
            return { Type: 'G4HPolyhedra', PhiStart: v[0], PhiTotal: v[1], NSides: sides, Z: z, RInner: a, ROuter: b };
          }
          if (v.length === 4 + 2 * n) {
            for (let i = 0; i < n; i++) { a.push(v[4 + 2 * i]); z.push(v[5 + 2 * i]); }
            return { Type: 'G4SPolyhedra', PhiStart: v[0], PhiTotal: v[1], NSides: sides, R: a, Z: z };
          }
          throw new Error(`POLYHEDRA with ${n} planes needs ${4 + 3 * n} or ${4 + 2 * n} parameters, found ${v.length}`);
        }
        case 'ELLIPTICALTUBE': need(3); return { Type: 'G4EllipticalTube', HLX: v[0], HLY: v[1], HLZ: v[2] };
        case 'ELLIPSOID':
          if (v.length === 3) return { Type: 'G4Ellipsoid', HLX: v[0], HLY: v[1], HLZ: v[2] };
          need(5); return { Type: 'G4Ellipsoid', HLX: v[0], HLY: v[1], HLZ: v[2], ZBottom: v[3], ZTop: v[4] };
        case 'ELLIPTICALCONE': need(4); return { Type: 'G4EllipticalCone', HLX: v[0], HLY: v[1], ZMax: v[2], ZTop: v[3] };
        case 'HYPE': need(5); return { Type: 'G4Hype', IR: v[0], OR: v[1], IS: v[2], OS: v[3], HLZ: v[4] };
        case 'TET': need(12); return { Type: 'G4Tet', Anchor: v.slice(0, 3), P2: v.slice(3, 6), P3: v.slice(6, 9), P4: v.slice(9, 12) };
        case 'TWISTEDBOX': need(4); return { Type: 'G4TwistedBox', Twist: v[0], HLX: v[1], HLY: v[2], HLZ: v[3] };
        case 'TWISTEDTRD': need(6); return { Type: 'G4TwistedTrd', HLX1: v[0], HLX2: v[1], HLY1: v[2], HLY2: v[3], HLZ: v[4], Twist: v[5] };
        case 'TWISTEDTRAP': need(11); return { Type: 'G4GTwistedTrap', Twist: v[0], HLZ: v[1], Theta: v[2], Phi: v[3], HLY1: v[4],
                                                HLX1: v[5], HLX2: v[6], HLY2: v[7], HLX3: v[8], HLX4: v[9], Alpha: v[10] };
        case 'TWISTEDTUBS': need(5); return { Type: 'G4TwistedTubs', Twist: v[0], EndInnerRad: v[1], EndOuterRad: v[2], HLZ: v[3], Phi: v[4] };
        case 'EXTRUDED': {
          const nv = Math.round(v[0]), poly = [];
          for (let i = 0; i < nv; i++) poly.push([v[1 + 2 * i], v[2 + 2 * i]]);
          const ns = Math.round(v[1 + 2 * nv]), sections = [];
          for (let i = 0; i < ns; i++) {
            const k = 2 + 2 * nv + 4 * i;
            sections.push({ z: v[k], off: [v[k + 1], v[k + 2]], scale: v[k + 3] });
          }
          if (nv < 3 || ns < 2 || v.length !== 2 + 2 * nv + 4 * ns || sections.some(s => s.scale === undefined)) {
            throw new Error('EXTRUDED needs: nvert, x y for each vertex, nsect, then z xoff yoff scale for each section');
          }
          return { Type: 'Extruded', Polygon: poly, Sections: sections };
        }
        case 'TESSELLATED': {
          const nf = Math.round(v[0]), tris = [];
          let k = 1;
          for (let f = 0; f < nf; f++) {
            const n = Math.round(v[k]);
            if (n !== 3 && n !== 4) throw new Error(`TESSELLATED facet ${f + 1} has ${n} points (3 or 4 allowed)`);
            const pts = [];
            for (let j = 0; j < n; j++) pts.push(v.slice(k + 1 + 3 * j, k + 4 + 3 * j));
            if (Math.round(v[k + 1 + 3 * n]) === 1) for (let j = 1; j < n; j++) pts[j] = pts[j].map((c, ci) => c + pts[0][ci]);
            tris.push(...pts[0], ...pts[1], ...pts[2]);
            if (n === 4) tris.push(...pts[0], ...pts[2], ...pts[3]);
            k += 3 * n + 2;
          }
          if (tris.some(x => x === undefined || isNaN(x))) throw new Error('TESSELLATED parameters run short');
          return { Type: 'Tessellated', Triangles: tris };
        }
        default:
          if (TG_NOT_IN_FORMAT.includes(type)) throw new Error(`${type} isn't available in the Geant4 text format`);
          throw new Error(`Unknown solid type '${type}'`);
      }
    }

    function normalizeTgType(t) { return String(t).toUpperCase().replace(/_/g, ''); }
    const TG_TYPES = new Set([...Object.keys(TG_PARAM_NAMES), ...TG_NOT_IN_FORMAT, 'MULTIUNION', 'SCALED']);

    function parseGamosGeometry(text, warnings, errors) {
      const records = readTextRecords(text);
      const params = {};
      const lookup = n => params[n];
      const value = (w, kind) => {
        if (isPlaceholder(w)) throw new Error(`fill in ${w}`);
        const r = evaluateExpression(w, lookup);
        if (r.hasUnit || kind === 'none') return r.value;
        return kind === 'angle' ? r.value * Math.PI / 180 : r.value;
      };
      const rotms = {}, solidDefs = {}, solids = {}, logicals = {}, placements = [], colours = {}, vis = {};
      const order = [];

      // pass 1: parameters, rotations, solid definitions
      for (const r of records) {
        try {
          if (r.tag === ':P') params[r.words[0]] = evaluateExpression(r.words[1], lookup);
          else if (r.tag === ':ROTM') {
            const [name, ...w] = r.words;
            const a = w.map(x => value(x, 'angle'));
            if (w.length === 3) rotms[name] = frameRotationXYZ(a[0], a[1], a[2]);
            else if (w.length === 6) {
              const col = (th, ph) => new THREE.Vector3(Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th));
              rotms[name] = new THREE.Matrix4().makeBasis(col(a[0], a[1]), col(a[2], a[3]), col(a[4], a[5]));
            } else if (w.length === 9) {
              const n = w.map(x => value(x, 'none'));
              rotms[name] = new THREE.Matrix4().makeBasis(new THREE.Vector3(n[0], n[1], n[2]), new THREE.Vector3(n[3], n[4], n[5]),
                                                          new THREE.Vector3(n[6], n[7], n[8]));
            } else throw new Error(`:ROTM ${name} needs 3 angles, 6 axis angles or 9 matrix values`);
          } else if (r.tag === ':SOLID') {
            solidDefs[r.words[0]] = { type: normalizeTgType(r.words[1]), words: r.words.slice(2), line: r.line };
          }
        } catch (e) {
          errors.push(`Line ${r.line}: ${e.message}`);
        }
      }

      const building = new Set();
      const buildSolid = (type, words, line, label) => {
        type = normalizeTgType(type);
        if (['UNION', 'SUBTRACTION', 'INTERSECTION'].includes(type)) {
          if (words.length !== 6) throw new Error(`${type} needs: solid1 solid2 rotm x y z`);
          const [a, b, rotName, x, y, z] = words;
          if (!rotms[rotName]) throw new Error(`rotation '${rotName}' isn't defined (:ROTM)`);
          return { Type: 'Boolean', Op: type.toLowerCase(), A: solidByName(a), B: solidByName(b),
                   BPlace: { pos: new THREE.Vector3(value(x, 'length'), value(y, 'length'), value(z, 'length')), rot: rotms[rotName] } };
        }
        if (type === 'MULTIUNION' || type === 'SCALED') throw new Error(`${type} solids aren't drawn by Quick View yet`);
        const angles = new Set(type === 'TRAP' && words.length === 4 ? [] : (TG_ANGLE_PARAMS[type] || []));
        return mapTextSolid(type, words.map((w, i) => value(w, angles.has(i) ? 'angle' : 'length')));
      };
      const solidByName = name => {
        if (solids[name]) return solids[name];
        const def = solidDefs[name];
        if (!def) throw new Error(`solid '${name}' isn't defined (:SOLID)`);
        if (building.has(name)) throw new Error(`solid '${name}' refers to itself`);
        building.add(name);
        try { solids[name] = buildSolid(def.type, def.words, def.line, name); } finally { building.delete(name); }
        return solids[name];
      };
      for (const [name, def] of Object.entries(solidDefs)) {
        try { solidByName(name); } catch (e) { errors.push(`Line ${def.line}: solid ${name}: ${e.message}`); }
      }

      // pass 2: volumes, placements, looks
      for (const r of records) {
        const w = r.words;
        try {
          if (r.tag === ':VOLU') {
            const name = w[0];
            let p = null, material;
            const inlineType = w.length >= 3 && TG_TYPES.has(normalizeTgType(w[1])) && !solidDefs[w[1]];
            if (inlineType) {
              material = w[w.length - 1];
              p = buildSolid(w[1], w.slice(2, -1), r.line, name);
            } else {
              if (w.length < 3) throw new Error(':VOLU needs: name solid material (or name TYPE parameters material)');
              material = w[2];
              p = solids[w[1]];
              if (!p) {
                if (!solidDefs[w[1]]) throw new Error(`solid '${w[1]}' isn't defined`);
                continue;   // its own error is already listed
              }
            }
            logicals[name] = { p, material, line: r.line };
            order.push(name);
          } else if (r.tag === ':PLACE') {
            const [vol, copy, parent, rotName, x, y, z] = w;
            if (w.length < 7) throw new Error(':PLACE needs: volume copyNo parent rotm x y z');
            [vol, parent, rotName].forEach(t => { if (isPlaceholder(t)) throw new Error(`fill in ${t}`); });
            if (!rotms[rotName]) throw new Error(`rotation '${rotName}' isn't defined (:ROTM)`);
            placements.push({ child: vol, parent, copy, pvName: vol, line: r.line, rot: rotms[rotName],
                              pos: new THREE.Vector3(value(x, 'length'), value(y, 'length'), value(z, 'length')) });
          } else if (r.tag === ':COLOUR' || r.tag === ':COLOR') {
            const [vol, ...c] = w;
            const rgb = c.slice(0, 3).map(x => Math.max(0, Math.min(1, value(x, 'none'))));
            if (rgb.length < 3) throw new Error(':COLOUR needs: volume r g b (0 to 1)');
            colours[vol] = (Math.round(rgb[0] * 255) << 16) | (Math.round(rgb[1] * 255) << 8) | Math.round(rgb[2] * 255);
          } else if (r.tag === ':VIS') {
            vis[w[0]] = !/^off$/i.test(w[1] || 'ON');
          } else if (/^:(PLACE_PARAM|DIVISION|REPL|PLACE_ASSEMBLY)/.test(r.tag)) {
            warnings.push(`Line ${r.line}: ${r.tag} volumes aren't drawn by Quick View yet`);
          } else if (r.tag === '#INCLUDE') {
            warnings.push(`Line ${r.line}: #include files aren't read; paste their contents here`);
          } else if (r.tag === '?') {
            warnings.push(`Line ${r.line}: text outside a :TAG line was ignored`);
          } else if (![':P', ':ROTM', ':SOLID'].includes(r.tag) && !IGNORED_TAGS.has(r.tag)) {
            warnings.push(`Line ${r.line}: ${r.tag} isn't used by Quick View`);
          }
        } catch (e) {
          errors.push(`Line ${r.line}: ${e.message}`);
        }
      }
      Object.entries(colours).forEach(([v, c]) => { if (logicals[v]) logicals[v].color = c; });
      Object.entries(vis).forEach(([v, on]) => { if (logicals[v]) logicals[v].invisible = !on; });

      const placed = new Set(placements.map(p => p.child));
      const roots = order.filter(n => !placed.has(n));
      const world = roots.find(n => /^world$/i.test(n)) || roots[0] || order[0];
      if (roots.length > 1) warnings.push(`Not placed anywhere (not drawn): ${roots.filter(n => n !== world).join(', ')}`);
      gamosNames = { logicals: order, solids: Object.keys(solidDefs), rotms: Object.keys(rotms), world: world || 'world',
                     placed: [...placed], params: Object.keys(params) };
      return expandInstances(logicals, placements, world, warnings, errors);
    }

    // --- /gamos/generator sources ---------------------------------------------------
    const GAMOS_POS_ARGS = {
      GmGenerDistPositionPoint: ['POS_X', 'POS_Y', 'POS_Z'],
      GmGenerDistPositionInG4Volumes: ['LV_NAME'],
      GmGenerDistPositionInG4VolumesGeneral: ['TOUCHABLE_NAME'],
      GmGenerDistPositionInUserVolumes: ['POS_X', 'POS_Y', 'POS_Z', 'ANG_X', 'ANG_Y', 'ANG_Z', 'SOLID_TYPE', 'SOLID_DIMENSIONS'],
      GmGenerDistPositionInG4Surfaces: ['LV_NAME'],
      GmGenerDistPositionInUserSurfaces: ['POS_X', 'POS_Y', 'POS_Z', 'ANG_X', 'ANG_Y', 'ANG_Z', 'SOLID_TYPE', 'SOLID_DIMENSIONS'],
      GmGenerDistPositionLineSteps: ['POS_X', 'POS_Y', 'POS_Z', 'DIR_X', 'DIR_Y', 'DIR_Z', 'STEP'],
      GmGenerDistPositionSquare: ['HALF_WIDTH', 'POS_X', 'POS_Y', 'POS_Z', 'DIR_X', 'DIR_Y', 'DIR_Z'],
      GmGenerDistPositionRectangle: ['HALF_WIDTH_X', 'HALF_WIDTH_Y', 'POS_X', 'POS_Y', 'POS_Z', 'DIR_X', 'DIR_Y', 'DIR_Z'],
      GmGenerDistPositionDisc: ['RADIUS', 'POS_X', 'POS_Y', 'POS_Z', 'DIR_X', 'DIR_Y', 'DIR_Z'],
      GmGenerDistPositionDiscGaussian: ['SIGMA', 'POS_X', 'POS_Y', 'POS_Z', 'DIR_X', 'DIR_Y', 'DIR_Z']
    };
    const GAMOS_DIR_ARGS = {
      GmGenerDistDirectionRandom: [],
      GmGenerDistDirectionConst: ['DIR_X', 'DIR_Y', 'DIR_Z'],
      GmGenerDistDirectionCone: ['DIR_X', 'DIR_Y', 'DIR_Z', 'OPENING_ANGLE'],
      GmGenerDistDirectionConeGaussian: ['DIR_X', 'DIR_Y', 'DIR_Z', 'ANGLE_GAUSSIAN_SIGMA'],
      GmGenerDistDirectionCone2DGaussian: ['DIR_X', 'DIR_Y', 'DIR_Z', 'ANGLE_GAUSSIAN_SIGMA_X', 'ANGLE_GAUSSIAN_SIGMA_Y'],
      GmGenerDistDirectionGaussian: ['DIR_X', 'DIR_Y', 'DIR_Z', 'SIGMA_Y', 'SIGMA_Z']
    };
    const GAMOS_USER_SOLIDS = new Set(['ORB', 'SPHERE', 'ELLIPSOID', 'TUBS', 'BOX', 'CONS']);

    function gamosNumber(w) {
      if (isPlaceholder(w)) throw new Error(`fill in ${w}`);
      return evaluateExpression(w).value;   // Geant4 internal units: mm, rad, MeV
    }

    function gamosPlane(shape, sizes, args) {
      const v = args.map(gamosNumber);
      const pos = new THREE.Vector3(v[0] || 0, v[1] || 0, v[2] || 0);
      const n = args.length >= 6 ? new THREE.Vector3(v[3], v[4], v[5]).normalize() : new THREE.Vector3(0, 0, 1);
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
      return { kind: 'plane', shape, ...sizes, matrix: new THREE.Matrix4().compose(pos, q, new THREE.Vector3(1, 1, 1)) };
    }

    function gamosPosition(cls, args, src, warnings) {
      const num = i => gamosNumber(args[i]);
      switch (cls) {
        case 'GmGenerDistPositionPoint':
          return { kind: 'point', center: new THREE.Vector3(args[0] ? num(0) : 0, args[1] ? num(1) : 0, args[2] ? num(2) : 0) };
        case 'GmGenerDistPositionInG4Volumes':
        case 'GmGenerDistPositionInG4VolumesGeneral':
          return { kind: 'volumes', names: args, surface: false };
        case 'GmGenerDistPositionInG4Surfaces':
          return { kind: 'volumes', names: args, surface: true };
        case 'GmGenerDistPositionInUserVolumes':
        case 'GmGenerDistPositionInUserSurfaces':
        case 'GmGenerDistPositionDirectionInUserSurfaces': {
          const t = args.findIndex(a => GAMOS_USER_SOLIDS.has(a.toUpperCase()));
          if (t < 0) throw new Error(`${cls} needs a solid type (ORB, SPHERE, ELLIPSOID, TUBS, BOX or CONS)`);
          const pre = args.slice(0, t).map(gamosNumber);
          const p = mapTextSolid(args[t].toUpperCase(), args.slice(t + 1).map(gamosNumber));
          const pos = new THREE.Vector3(pre[0] || 0, pre[1] || 0, pre[2] || 0);
          // GAMOS docs: rotate about X, then Y, then Z, around (0,0,0) after the displacement
          const rot = new THREE.Matrix4().makeRotationZ(pre[5] || 0).multiply(new THREE.Matrix4().makeRotationY(pre[4] || 0))
                                         .multiply(new THREE.Matrix4().makeRotationX(pre[3] || 0));
          const matrix = rot.multiply(new THREE.Matrix4().makeTranslation(pos.x, pos.y, pos.z));
          return { kind: 'solid', p, matrix, surface: cls !== 'GmGenerDistPositionInUserVolumes' };
        }
        case 'GmGenerDistPositionLineSteps': {
          const v = args.map(gamosNumber);
          return { kind: 'line', start: new THREE.Vector3(v[0], v[1], v[2]), dir: new THREE.Vector3(v[3], v[4], v[5]),
                   length: v[6] ? 20 * v[6] : null };
        }
        case 'GmGenerDistPositionSquare': return gamosPlane('square', { a: num(0) }, args.slice(1));
        case 'GmGenerDistPositionRectangle': return gamosPlane('rectangle', { a: num(0), b: num(1) }, args.slice(2));
        case 'GmGenerDistPositionDisc': return gamosPlane('circle', { a: num(0) }, args.slice(1));
        case 'GmGenerDistPositionDiscGaussian': return gamosPlane('circle', { a: 2 * num(0) }, args.slice(1));
        default:
          warnings.push(`Source ${src}: ${cls} isn't drawn by Quick View; showing the origin`);
          return { kind: 'point', center: new THREE.Vector3() };
      }
    }

    function gamosDirection(cls, args, src, warnings) {
      const v = args.map(gamosNumber);
      const d = () => new THREE.Vector3(v[0], v[1], v[2]);
      switch (cls) {
        case 'GmGenerDistDirectionRandom': return { kind: 'iso' };
        case 'GmGenerDistDirectionConst': return { kind: 'const', dir: d() };
        case 'GmGenerDistDirectionCone': return { kind: 'cone', dir: d(), half: v[3] };
        case 'GmGenerDistDirectionConeGaussian': return { kind: 'cone', dir: d(), half: 2 * v[3] };
        case 'GmGenerDistDirectionCone2DGaussian': return { kind: 'cone', dir: d(), half: 2 * Math.max(v[3], v[4]) };
        case 'GmGenerDistDirectionGaussian': return { kind: 'const', dir: d() };
        default:
          warnings.push(`Source ${src}: ${cls} directions aren't drawn; showing isotropic`);
          return { kind: 'iso' };
      }
    }

    function parseGamosMacro(text, warnings, errors) {
      const sources = {}, order = [];
      text.split(/\r?\n/).forEach((raw, i) => {
        const line = raw.replace(/#.*$/, '').trim();
        if (!line.startsWith('/gamos/generator')) return;
        const w = tgWords(line), cmd = w[0], n = i + 1;
        try {
          const m = cmd.match(/^\/gamos\/generator\/add(SingleParticle|Isotope|DoubleBackToBackParticle)Source$/i);
          if (m) {
            if (w.length < 4) throw new Error(`${cmd} needs: SOURCE_NAME ${m[1] === 'Isotope' ? 'ISOTOPE ACTIVITY' : 'PARTICLE ENERGY'}`);
            sources[w[1]] = { name: w[1], what: `${w[2]} ${w[3]}`, kind: m[1], pos: { kind: 'point', center: new THREE.Vector3() },
                              dir: { kind: 'iso' }, extra: [], line: n };
            order.push(w[1]);
            return;
          }
          const src = sources[w[1]];
          if (/\/(positionDist|directionDist|energyDist|timeDist|addVolumeOrSurface)$/.test(cmd) && !src) {
            throw new Error(`source '${w[1]}' hasn't been added yet`);
          }
          if (/\/positionDist$/.test(cmd)) {
            src.pos = gamosPosition(w[2], w.slice(3), w[1], warnings);
            if (w[2] === 'GmGenerDistPositionDirectionInUserSurfaces') {
              src.dir = { kind: 'focus', point: new THREE.Vector3().setFromMatrixPosition(src.pos.matrix) };
            }
          } else if (/\/directionDist$/.test(cmd)) {
            if (w[2] !== 'GmGenerDistPositionDirectionInUserSurfaces') src.dir = gamosDirection(w[2], w.slice(3), w[1], warnings);
          } else if (/\/addVolumeOrSurface$/.test(cmd)) {
            src.extra.push(w.slice(2));
          }
        } catch (e) {
          errors.push(`Macro line ${n}: ${e.message}`);
        }
      });
      const emitters = [];
      for (const name of order) {
        const s = sources[name];
        emitters.push({ name, label: `${name}: ${s.what}`, pos: s.pos, dir: s.dir });
        s.extra.forEach((args, k) => {
          let pos;
          if (s.pos.kind === 'volumes') pos = { kind: 'volumes', names: args, surface: s.pos.surface };
          else {
            try { pos = gamosPosition(s.pos.surface ? 'GmGenerDistPositionInUserSurfaces' : 'GmGenerDistPositionInUserVolumes', args, name, warnings); }
            catch (e) { errors.push(`Source ${name}: ${e.message}`); return; }
          }
          emitters.push({ name: `${name}+${k + 1}`, label: `${name} (+${k + 1})`, pos, dir: s.dir });
        });
      }
      if (/\/gamos\/generator\//.test(text) && !/^\s*\/gamos\/generator\s+GmGenerator/m.test(text)) {
        warnings.push('Macro: add "/gamos/generator GmGenerator" before the generator commands');
      }
      return emitters;
    }

    // --- + Add templates --------------------------------------------------------------
    function uniqueIn(base, taken) {
      const set = new Set(taken.map(t => t.toLowerCase()));
      let name = base, i = 2;
      while (set.has(name.toLowerCase())) name = base + i++;
      return name;
    }

    function rotmLinesIfMissing() {
      return gamosNames.rotms.includes('R00') ? [] : [':ROTM R00 0. 0. 0.'];
    }

    function insertGamosSolid(type) {
      const taken = [...gamosNames.logicals, ...gamosNames.solids];
      const base = type.charAt(0) + type.slice(1).toLowerCase();
      const name = uniqueIn(base, taken);
      const colour = TG_COLOURS[gamosNames.logicals.length % TG_COLOURS.length];
      const lines = [`// ${type}: ${TG_PARAM_NAMES[type].join(' ')}`, ...rotmLinesIfMissing()];
      if (['UNION', 'SUBTRACTION', 'INTERSECTION'].includes(type)) {
        const a = uniqueIn(name + 'A', taken), b = uniqueIn(name + 'B', taken);
        lines.push(`:SOLID ${a} BOX 30. 30. 30.`, `:SOLID ${b} TUBE 0. 15. 50.`, `:SOLID ${name} ${type} ${a} ${b} R00 0. 0. 30.`);
      } else {
        lines.push(`:SOLID ${name} ${type} ${TG_TEMPLATES[type]}`);
      }
      lines.push(`:VOLU ${name} ${name} G4_WATER`, `:PLACE ${name} 1 ${gamosNames.world} R00 0. 0. 0.`, `:COLOUR ${name} ${colour}`);
      appendLines(geomEditor, lines);
    }

    const GAMOS_SOURCE_TEMPLATES = {
      'Point, isotropic': n => [`/gamos/generator/addSingleParticleSource ${n} gamma 1.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionPoint 0. 0. 0.`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionRandom`],
      'Disc beam': n => [`/gamos/generator/addSingleParticleSource ${n} e- 6.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionDisc 20. 0. 0. 300. 0. 0. -1.`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionConst 0. 0. -1.`],
      'Gaussian disc beam': n => [`/gamos/generator/addSingleParticleSource ${n} proton 150.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionDiscGaussian 5. 0. 0. 300. 0. 0. -1.`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionConst 0. 0. -1.`],
      'Square beam': n => [`/gamos/generator/addSingleParticleSource ${n} gamma 6.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionSquare 50. 0. 0. 300. 0. 0. -1.`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionConst 0. 0. -1.`],
      'Rectangle beam': n => [`/gamos/generator/addSingleParticleSource ${n} gamma 6.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionRectangle 50. 30. 0. 0. 300. 0. 0. -1.`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionConst 0. 0. -1.`],
      'Point, cone': n => [`/gamos/generator/addSingleParticleSource ${n} gamma 1.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionPoint 0. 0. 300.`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionCone 0. 0. -1. 15.*deg`],
      'Isotope in a volume': n => [`/gamos/generator/addIsotopeSource ${n} F18 1.E6*becquerel`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionInG4Volumes ${firstVolume()}`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionRandom`],
      'On a volume surface': n => [`/gamos/generator/addSingleParticleSource ${n} gamma 1.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionInG4Surfaces ${firstVolume()}`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionRandom`],
      'In a user volume': n => [`/gamos/generator/addSingleParticleSource ${n} gamma 1.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionInUserVolumes 0. 0. 0. 0. 0. 0. ORB 20.`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionRandom`],
      'On a user surface, inward': n => [`/gamos/generator/addSingleParticleSource ${n} gamma 1.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionDirectionInUserSurfaces 0. 0. 0. 0. 0. 0. ORB 150.`,
        `/gamos/generator/directionDist ${n} GmGenerDistPositionDirectionInUserSurfaces`],
      'Line of steps': n => [`/gamos/generator/addSingleParticleSource ${n} gamma 1.*MeV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionLineSteps -50. 0. 0. 1. 0. 0. 5.`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionRandom`],
      'Back-to-back pair': n => [`/gamos/generator/addDoubleBackToBackParticleSource ${n} gamma 511*keV`,
        `/gamos/generator/positionDist ${n} GmGenerDistPositionPoint 0. 0. 0.`,
        `/gamos/generator/directionDist ${n} GmGenerDistDirectionRandom`]
    };

    function firstVolume() {
      return gamosNames.placed.find(n => n !== gamosNames.world) || '<LV_NAME>';
    }

    function insertGamosSource(label) {
      const names = parsedSources.map(s => s.name);
      const name = uniqueIn('source', names);
      const lines = GAMOS_SOURCE_TEMPLATES[label](name);
      const text = macroEditor.getValue();
      if (!/^\s*\/gamos\/generator\s+GmGenerator/m.test(text)) lines.unshift('/gamos/generator GmGenerator');
      // keep sources ahead of /run/beamOn
      const beamOn = text.split('\n').findIndex(l => /^\s*\/run\/beamOn/.test(l));
      if (beamOn >= 0) {
        showTab('macro');
        macroEditor.replaceRange(lines.join('\n') + '\n\n', { line: beamOn, ch: 0 });
        macroEditor.scrollIntoView({ line: beamOn + lines.length, ch: 0 });
        updateGeometry();
      } else {
        appendLines(macroEditor, lines);
      }
    }

    // --- click menu -------------------------------------------------------------------
    function gamosGeomMenu(cm, lineNo) {
      const words = tgWords(cm.getLine(lineNo).replace(/\/\/.*$/, ''));
      const tag = (words[0] || '').toUpperCase();
      const text = cm.getValue();
      const has = re => re.test(text);
      const groups = [];
      const after = (t) => () => focusPlaceholder(cm, insertLineAfter(cm, lineNo, t));
      let title = null;

      const volumeItems = vol => {
        const items = [];
        if (!gamosNames.placed.includes(vol) && vol !== gamosNames.world) {
          items.push({ label: `Place it (:PLACE in ${gamosNames.world})`, apply: after(`:PLACE ${vol} 1 ${gamosNames.world} R00 <x> <y> <z>`) });
        } else if (vol !== gamosNames.world) {
          items.push({ label: 'Place another copy (:PLACE)', apply: after(`:PLACE ${vol} <copyNo> ${gamosNames.world} R00 <x> <y> <z>`) });
        }
        if (!has(new RegExp(`^\\s*:COLOU?R\\s+${escapeRegExp(vol)}\\s`, 'mi'))) items.push({ label: 'Colour (:COLOUR r g b)', apply: after(`:COLOUR ${vol} <r> <g> <b>`) });
        if (!has(new RegExp(`^\\s*:VIS\\s+${escapeRegExp(vol)}\\s`, 'mi'))) items.push({ label: 'Visibility (:VIS)', apply: after(`:VIS ${vol} <ON|OFF>`) });
        return items;
      };
      const paramItems = (type, given, insertAt) => {
        const names = TG_PARAM_NAMES[type], fixed = TG_FIXED_COUNTS[type];
        if (!names || !fixed || given >= fixed) return [];
        const missing = names.slice(given, fixed);
        return [{ label: `Add missing: ${missing.join(' ')}`, apply: () => {
          const ch = insertAt();
          cm.replaceRange(' ' + missing.map(m => `<${m}>`).join(' '), { line: lineNo, ch });
          focusPlaceholder(cm, lineNo);
        } }];
      };
      const wordEnd = (k) => {
        const line = cm.getLine(lineNo);
        let idx = 0;
        for (let i = 0; i <= k; i++) { const at = line.indexOf(words[i], idx); idx = at + words[i].length; }
        return idx;
      };

      if (tag === ':SOLID' && words[2]) {
        const type = normalizeTgType(words[2]);
        title = `${words[1]}: ${type} ${(TG_PARAM_NAMES[type] || []).join(' ')}`;
        groups.push({ label: 'Parameters', items: paramItems(type, words.length - 3, () => wordEnd(words.length - 1)) });
        if (!has(new RegExp(`^\\s*:VOLU\\s+\\S+\\s+${escapeRegExp(words[1])}\\s`, 'mi'))) {
          groups.push({ label: 'Volume', items: [{ label: 'Make a volume from it (:VOLU)', apply: after(`:VOLU ${words[1]} ${words[1]} <material>`) }] });
        }
      } else if (tag === ':VOLU' && words[1]) {
        const inline = words.length >= 4 && TG_TYPES.has(normalizeTgType(words[2])) && !gamosNames.solids.includes(words[2]);
        const type = inline ? normalizeTgType(words[2]) : null;
        title = inline ? `${words[1]}: ${type} ${(TG_PARAM_NAMES[type] || []).join(' ')} material` : `Volume ${words[1]}`;
        if (inline) groups.push({ label: 'Parameters', items: paramItems(type, words.length - 4, () => wordEnd(words.length - 2)) });
        groups.push({ label: 'Placement & look', items: volumeItems(words[1]) });
      } else if (tag === ':PLACE' && words[1]) {
        title = `Placement of ${words[1]}: volume copyNo parent rotm x y z`;
        const items = volumeItems(words[1]).filter(it => !/Place it/.test(it.label));
        if (words[4] && !gamosNames.rotms.includes(words[4]) && !isPlaceholder(words[4])) {
          items.unshift({ label: `Define rotation ${words[4]} (:ROTM)`, apply: after(`:ROTM ${words[4]} <rx> <ry> <rz>`) });
        }
        groups.push({ label: 'Placement & look', items });
      } else {
        return null;
      }
      groups.push({ label: 'New', items: [
        { label: 'Rotation (:ROTM name rx ry rz)', apply: after(`:ROTM <name> <rx> <ry> <rz>`) },
        { label: 'Parameter (:P name value)', apply: after(`:P <name> <value>`) }
      ] });
      return { title, groups };
    }

    function gamosMacroMenu(cm, lineNo) {
      const w = tgWords(cm.getLine(lineNo).replace(/#.*$/, ''));
      if (!w[0] || !/^\/gamos\/generator\/(add\w+Source|positionDist|directionDist|energyDist)$/i.test(w[0]) || !w[1]) return null;
      const name = w[1];
      let last = lineNo;
      cm.eachLine(h => {
        const t = tgWords(h.text.replace(/#.*$/, ''));
        if (t[0] && t[0].startsWith('/gamos/generator/') && t[1] === name) last = Math.max(last, cm.getLineNumber(h));
      });
      const text = cm.getValue();
      const hasCmd = c => new RegExp(`^\\s*\\/gamos\\/generator\\/${c}\\s+${escapeRegExp(name)}\\s`, 'mi').test(text);
      const add = t => () => focusPlaceholder(cm, insertLineAfter(cm, last, t));
      const line = (cmd, cls, args) => `/gamos/generator/${cmd} ${name} ${cls}${args.length ? ' ' + args.map(a => `<${a}>`).join(' ') : ''}`;
      const verb = has => has ? 'Replace' : 'Set';
      return {
        title: `Source ${name}`,
        groups: [
          { label: `Position (${verb(hasCmd('positionDist')).toLowerCase()})`, items: Object.entries(GAMOS_POS_ARGS).map(([cls, args]) => ({
              label: cls.replace('GmGenerDistPosition', ''), apply: add(line('positionDist', cls, args)) })) },
          { label: `Direction (${verb(hasCmd('directionDist')).toLowerCase()})`, items: Object.entries(GAMOS_DIR_ARGS).map(([cls, args]) => ({
              label: cls.replace('GmGenerDistDirection', ''), apply: add(line('directionDist', cls, args)) })) },
          { label: 'Energy', items: hasCmd('energyDist') ? [] : [
              { label: 'Constant', apply: add(line('energyDist', 'GmGenerDistEnergyConstant', ['ENERGY'])) },
              { label: 'Flat between two energies', apply: add(line('energyDist', 'GmGenerDistEnergyRandomFlat', ['ENERGY_MIN', 'ENERGY_MAX'])) }] }
        ]
      };
    }

    const FORMAT = {
      geomMode: 'g4text',
      geomFileName: 'geometry.geom',
      macroFileName: 'run.in',
      isGeometryFile: n => /\.(geom|tg|txt)$/i.test(n),
      defaultGeom: `// GAMOS geometry (Geant4 text format)
// Lengths are mm and angles are deg unless a unit is given (e.g. 10.*cm)
:ROTM R00 0. 0. 0.

:VOLU world BOX 500. 500. 500. G4_AIR
:VIS world OFF

:VOLU phantom BOX 120. 120. 90. G4_WATER
:PLACE phantom 1 world R00 0. 0. 0.
:COLOUR phantom 0.25 0.41 0.88

:SOLID applicator TUBS 20. 42. 90. 0. 360.
:VOLU applicator applicator G4_PLEXIGLASS
:PLACE applicator 1 world R00 0. 0. 200.
:COLOUR applicator 0.85 0.85 0.85
`,
      defaultMacro: `# GAMOS run macro
/gamos/setParam GmGeometryFromText:FileName geometry.geom
/gamos/geometry GmGeometryFromText
/gamos/physicsList GmEMPhysics
/gamos/generator GmGenerator
/run/initialize

/gamos/generator/addSingleParticleSource beam e- 6.*MeV
/gamos/generator/positionDist beam GmGenerDistPositionDisc 20. 0. 0. 400. 0. 0. -1.
/gamos/generator/directionDist beam GmGenerDistDirectionConst 0. 0. -1.

/run/beamOn 1000
`,
      parse(geomText, macroText) {
        const warnings = [], errors = [];
        const geometry = parseGamosGeometry(geomText, warnings, errors);
        const sources = parseGamosMacro(macroText, warnings, errors);
        return { geometry, sources, warnings, errors };
      },
      addGroups() {
        const solidTypes = [...Object.keys(TG_TEMPLATES), 'UNION', 'SUBTRACTION', 'INTERSECTION'];
        return [
          { label: 'Solids', items: solidTypes.map(t => ({ label: t, apply: () => insertGamosSolid(t) })) },
          { label: 'Sources', items: Object.keys(GAMOS_SOURCE_TEMPLATES).map(l => ({ label: l, apply: () => insertGamosSource(l) })) }
        ];
      },
      menuFor(which, cm, line) {
        return which === 'geom' ? gamosGeomMenu(cm, line) : gamosMacroMenu(cm, line);
      }
    };

  </script>
</body>
</html>
