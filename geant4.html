          case 'twistedtrap': return { Type: 'G4GTwistedTrap', Twist: ang('PhiTwist'), HLZ: half('z'), Theta: ang('Theta'), Phi: ang('Phi'),
                                       HLY1: half('y1'), HLX1: half('x1'), HLX2: half('x2'), HLY2: half('y2'), HLX3: half('x3'), HLX4: half('x4'), Alpha: ang('Alph') };
          case 'twistedtubs': {
            const phi = el.hasAttribute('phi') ? ang('phi') : ang('totphi', TWO_PI) / attr(el, 'nseg', 1);
            return { Type: 'G4TwistedTubs', Twist: ang('twistedangle'), EndInnerRad: len('endinnerrad'), EndOuterRad: len('endouterrad'), HLZ: half('zlen'), Phi: phi };
          }
          case 'arb8': {
            const v = [];
            for (let i = 1; i <= 8; i++) v.push(attr(el, `v${i}x`, 0) * L, attr(el, `v${i}y`, 0) * L);
            return { Type: 'G4GenericTrap', HLZ: len('dz'), Vertices: v };
          }
          case 'tessellated': {
            const tris = [];
            for (const f of gdmlChildren(el)) {
              if (f.localName !== 'triangular' && f.localName !== 'quadrangular') continue;
              const fl = unit(f, 'lunit', 'mm');
              const keys = f.localName === 'triangular' ? ['vertex1', 'vertex2', 'vertex3'] : ['vertex1', 'vertex2', 'vertex3', 'vertex4'];
              const pts = keys.map(k => {
                const pos = positions[f.getAttribute(k)];
                if (!pos) throw new Error(`facet ${k} '${f.getAttribute(k)}' isn't defined`);
                return pos.clone().multiplyScalar(fl);
              });
              if (f.getAttribute('type') === 'RELATIVE') for (let i = 1; i < pts.length; i++) pts[i].add(pts[0]);
              tris.push(...pts[0].toArray(), ...pts[1].toArray(), ...pts[2].toArray());
              if (pts.length === 4) tris.push(...pts[0].toArray(), ...pts[2].toArray(), ...pts[3].toArray());
            }
            if (!tris.length) throw new Error('has no facets');
            return { Type: 'Tessellated', Triangles: tris };
          }
          case 'union': case 'subtraction': case 'intersection': {
            const first = gdmlChildren(el, 'first')[0], second = gdmlChildren(el, 'second')[0];
            if (!first || !second) throw new Error('needs <first> and <second>');
            // G4GDMLReadSolids::BooleanRead: G4Transform3D(GetRotationMatrix(rotation), position), not inverted
            const place = (posTag, rotTag) => {
              const pos = childVector(el, posTag, positions, 'mm') || new THREE.Vector3();
              const r = childVector(el, rotTag, rotations, 'rad');
              return { pos, rot: r ? frameRotationXYZ(r.x, r.y, r.z) : null, active: true };
            };
            return { Type: 'Boolean', Op: el.localName, A: solidRef(first.getAttribute('ref')), B: solidRef(second.getAttribute('ref')),
                     BPlace: place('position', 'rotation'), APlace: place('firstposition', 'firstrotation') };
          }
          case 'scaledSolid': {
            const ref = gdmlChildren(el, 'solidref')[0];
            const s = childVector(el, 'scale', scales, 'mm') || new THREE.Vector3(1, 1, 1);
            return { Type: 'Scaled', A: solidRef(ref && ref.getAttribute('ref')), ScaleVec: s.toArray() };
          }
          case 'opticalsurface': return undefined;
          default:
            warnings.push(`Line ${lineOf(el.getAttribute('name'))}: <${el.localName}> solids aren't drawn by Quick View yet`);
            return undefined;
        }
      };

      const solidsEl = doc.getElementsByTagName('solids')[0];
      if (solidsEl) for (const el of gdmlChildren(solidsEl)) {
        const name = el.getAttribute('name');
        try {
          const p = readSolid(el);
          if (p) solids[name] = p;
        } catch (e) {
          errors.push(`Line ${lineOf(name)}: <${el.localName}> '${name}': ${e.message}`);
        }
      }

      const logicals = {}, placements = [], volumeOrder = [], physvols = [];
      const structure = doc.getElementsByTagName('structure')[0];
      if (structure) for (const el of gdmlChildren(structure)) {
        const name = el.getAttribute('name');
        try {
          if (el.localName !== 'volume' && el.localName !== 'assembly') {
            if (/surface$/.test(el.localName)) continue;
            warnings.push(`Line ${lineOf(name)}: <${el.localName}> isn't drawn by Quick View yet`);
            continue;
          }
          let p = null, material;
          if (el.localName === 'volume') {
            const sref = gdmlChildren(el, 'solidref')[0], mref = gdmlChildren(el, 'materialref')[0];
            material = mref && mref.getAttribute('ref');
            const sname = sref && sref.getAttribute('ref');
            if (!sname) throw new Error('needs a <solidref>');
            p = solids[sname];
            if (!p && solidsEl && !Array.from(solidsEl.children).some(s => s.getAttribute('name') === sname)) {
              throw new Error(`solid '${sname}' isn't defined`);
            }
          }
          const lv = { p: p || (el.localName === 'assembly' ? null : { Type: 'Group' }), material, line: lineOf(name) };
          for (const aux of gdmlChildren(el, 'auxiliary')) {
            const type = (aux.getAttribute('auxtype') || '').toLowerCase(), val = aux.getAttribute('auxvalue') || '';
            if (type === 'color' || type === 'colour') lv.color = parseColour(val);
            if ((type === 'visibility' || type === 'visible') && /^(false|0|off)$/i.test(val)) lv.invisible = true;
            if (type === 'invisible' && /^(true|1|on)$/i.test(val)) lv.invisible = true;
          }
          logicals[name] = lv;
          volumeOrder.push(name);
          for (const pv of gdmlChildren(el, 'physvol')) {
            const vref = gdmlChildren(pv, 'volumeref')[0];
            if (!vref) {
              warnings.push(`Line ${lineOf(name)}: physvol in '${name}' loads another file; not drawn`);
              continue;
            }
            const child = vref.getAttribute('ref');
            const pos = childVector(pv, 'position', positions, 'mm') || new THREE.Vector3();
            const r = childVector(pv, 'rotation', rotations, 'rad');
            const sc = childVector(pv, 'scale', scales, 'mm');
            if (sc && (sc.x !== 1 || sc.y !== 1 || sc.z !== 1)) warnings.push(`physvol of '${child}': scale isn't drawn`);
            const pvName = pv.getAttribute('name') || child;
            physvols.push(pvName);
            // G4GDMLReadStructure::PhysvolRead: G4Transform3D(GetRotationMatrix(rotation).inverse(), position)
            placements.push({ child, parent: name, copy: pv.getAttribute('copynumber') || 0, pvName, pos,
                              rot: r ? frameRotationXYZ(r.x, r.y, r.z) : null, line: lineOf(pvName) });
          }
        } catch (e) {
          errors.push(`Line ${lineOf(name)}: <${el.localName}> '${name}': ${e.message}`);
        }
      }
      const worldRef = doc.querySelector('setup > world');
      let world = worldRef && worldRef.getAttribute('ref');
      if (!world) {
        world = volumeOrder[volumeOrder.length - 1];
        if (world) warnings.push(`No <setup><world ref="..."/></setup>; using '${world}' as the world`);
      } else if (!logicals[world]) {
        errors.push(`World volume '${world}' isn't defined`);
      }
      gdmlNames = { solids: Object.keys(solids), volumes: volumeOrder, world: world || 'World', physvols };
      return expandInstances(logicals, placements, logicals[world] ? world : null, warnings, errors);
    }

    function parseColour(val) {
      const v = val.trim();
      if (/^#?[0-9a-f]{6}$/i.test(v)) return parseInt(v.replace('#', ''), 16);
      const parts = v.split(/[\s,]+/).map(Number);
      if (parts.length >= 3 && parts.every(x => !isNaN(x))) {
        const s = parts.slice(0, 3).some(x => x > 1) ? 1 : 255;
        return (Math.round(parts[0] * s) << 16) | (Math.round(parts[1] * s) << 8) | Math.round(parts[2] * s);
      }
      return colorNameToHex(v);
    }

    // --- General Particle Source ------------------------------------------------------
    function newGpsSource(index, line) {
      return { name: `source${index}`, particle: 'geantino', energy: '1 MeV', posType: 'Point', shape: null,
               centre: new THREE.Vector3(), rot1: new THREE.Vector3(1, 0, 0), rot2: new THREE.Vector3(0, 1, 0),
               halfx: 0, halfy: 0, halfz: 0, radius: 0, radius0: 0, sigmaR: 0, sigmaX: 0, sigmaY: 0, paralp: 0, parthe: 0, parphi: 0,
               confine: [], angType: 'planar', direction: new THREE.Vector3(0, 0, -1),
               angRot1: new THREE.Vector3(1, 0, 0), angRot2: new THREE.Vector3(0, 1, 0), userAngRef: false,
               minTheta: 0, maxTheta: Math.PI, minPhi: 0, maxPhi: TWO_PI, focus: new THREE.Vector3(), touched: false, line };
    }

    function gpsFrame(r1, r2) {
      const x = r1.clone().normalize();
      const z = r1.clone().cross(r2).normalize();
      const y = z.clone().cross(x);
      return new THREE.Matrix4().makeBasis(x, y, z);
    }

    function parseGPS(text, warnings, errors) {
      const sources = [];
      let cur = null;
      text.split(/\r?\n/).forEach((raw, i) => {
        const line = raw.replace(/#.*$/, '').trim();
        if (!/^\/gps\//i.test(line)) return;
        const w = line.split(/\s+/), cmd = w[0].toLowerCase(), n = i + 1;
        if (!cur) { cur = newGpsSource(0, n); sources.push(cur); }
        // "/gps/x 1 2 3 cm": count numbers, then an optional unit (GPS default units: cm, rad)
        const nums = (count, defUnit) => {
          const vals = w.slice(1, 1 + count).map(v => {
            if (isPlaceholder(v)) throw new Error(`fill in ${v}`);
            const x = Number(v);
            if (isNaN(x)) throw new Error(`'${v}' is not a number`);
            return x;
          });
          if (vals.length < count) throw new Error(`${w[0]} needs ${count} value${count > 1 ? 's' : ''}`);
          const u = w[1 + count] || defUnit;
          if (defUnit && CLHEP_UNITS[u] === undefined) throw new Error(`unknown unit '${u}'`);
          return vals.map(x => x * (defUnit ? CLHEP_UNITS[u] : 1));
        };
        const vec = (defUnit) => new THREE.Vector3(...nums(3, defUnit));
        try {
          const blank = w.slice(1).find(isPlaceholder);
          if (blank) throw new Error(`fill in ${blank}`);
          if (cmd === '/gps/source/add') {
            if (cur.touched) { cur = newGpsSource(sources.length, n); sources.push(cur); }
            return;
          }
          cur.touched = true;
          switch (cmd) {
            case '/gps/particle': cur.particle = w[1]; break;
            case '/gps/ion': cur.particle = `ion ${w.slice(1, 3).join(' ')}`; break;
            case '/gps/energy': cur.energy = w.slice(1).join(' '); break;
            case '/gps/pos/type': cur.posType = w[1]; break;
            case '/gps/pos/shape': cur.shape = w[1]; break;
            case '/gps/pos/centre': cur.centre = vec('cm'); break;
            case '/gps/pos/rot1': cur.rot1 = vec(null); break;
            case '/gps/pos/rot2': cur.rot2 = vec(null); break;
            case '/gps/pos/halfx': cur.halfx = nums(1, 'cm')[0]; break;
            case '/gps/pos/halfy': cur.halfy = nums(1, 'cm')[0]; break;
            case '/gps/pos/halfz': cur.halfz = nums(1, 'cm')[0]; break;
            case '/gps/pos/radius': cur.radius = nums(1, 'cm')[0]; break;
            case '/gps/pos/radius0': cur.radius0 = nums(1, 'cm')[0]; break;
            case '/gps/pos/sigma_r': cur.sigmaR = nums(1, 'cm')[0]; break;
            case '/gps/pos/sigma_x': cur.sigmaX = nums(1, 'cm')[0]; break;
            case '/gps/pos/sigma_y': cur.sigmaY = nums(1, 'cm')[0]; break;
            case '/gps/pos/paralp': cur.paralp = nums(1, 'rad')[0]; break;
            case '/gps/pos/parthe': cur.parthe = nums(1, 'rad')[0]; break;
            case '/gps/pos/parphi': cur.parphi = nums(1, 'rad')[0]; break;
            case '/gps/pos/confine': cur.confine = w.slice(1).filter(x => !/^null$/i.test(x)); break;
            case '/gps/direction': cur.direction = vec(null); cur.angType = 'planar'; break;
            case '/gps/ang/type': cur.angType = w[1]; break;
            case '/gps/ang/rot1': cur.angRot1 = vec(null); cur.userAngRef = true; break;
            case '/gps/ang/rot2': cur.angRot2 = vec(null); cur.userAngRef = true; break;
            case '/gps/ang/user_coor': cur.userAngRef = /^(true|1)$/i.test(w[1] || 'true'); break;
            case '/gps/ang/mintheta': cur.minTheta = nums(1, 'rad')[0]; break;
            case '/gps/ang/maxtheta': cur.maxTheta = nums(1, 'rad')[0]; break;
            case '/gps/ang/minphi': cur.minPhi = nums(1, 'rad')[0]; break;
            case '/gps/ang/maxphi': cur.maxPhi = nums(1, 'rad')[0]; break;
            case '/gps/ang/focuspoint': cur.focus = vec('cm'); break;
          }
        } catch (e) {
          errors.push(`Macro line ${n}: ${e.message}`);
        }
      });
      return sources.map(s => gpsEmitter(s, warnings));
    }

    function gpsEmitter(s, warnings) {
      const frame = gpsFrame(s.rot1, s.rot2);
      const matrix = frame.clone().setPosition(s.centre);
      const type = s.posType.toLowerCase(), shape = (s.shape || '').toLowerCase();
      let pos = { kind: 'point', center: s.centre.clone() };
      const plane = (shp, sizes) => ({ kind: 'plane', shape: shp, ...sizes, matrix });
      if (type === 'plane') {
        if (shape === 'circle' && s.radius > 0) pos = plane('circle', { a: s.radius });
        else if (shape === 'annulus' && s.radius > 0) pos = plane('annulus', { a: s.radius, a0: s.radius0 });
        else if (shape === 'ellipse' && s.halfx > 0 && s.halfy > 0) pos = plane('ellipse', { a: s.halfx, b: s.halfy });
        else if (shape === 'square' && s.halfx > 0) pos = plane('square', { a: s.halfx });
        else if (shape === 'rectangle' && s.halfx > 0 && s.halfy > 0) pos = plane('rectangle', { a: s.halfx, b: s.halfy });
        else warnings.push(`Source ${s.name}: Plane needs /gps/pos/shape and its size; showing the centre`);
      } else if (type === 'beam') {
        const sx = s.sigmaX || s.sigmaR, sy = s.sigmaY || s.sigmaR;
        if (s.radius > 0) pos = plane('circle', { a: s.radius });
        else if (sx > 0 && sy > 0) pos = sx === sy ? plane('circle', { a: 2 * sx }) : plane('ellipse', { a: 2 * sx, b: 2 * sy });
      } else if (type === 'surface' || type === 'volume') {
        let p = null;
        if (shape === 'sphere' && s.radius > 0) p = { Type: 'G4Orb', R: s.radius };
        else if (shape === 'ellipsoid' && s.halfx > 0) p = { Type: 'G4Ellipsoid', HLX: s.halfx, HLY: s.halfy, HLZ: s.halfz };
        else if (shape === 'cylinder' && s.radius > 0) p = { Type: 'TsCylinder', RMax: s.radius, HL: s.halfz };
        else if (shape === 'ellipticcylinder' && s.halfx > 0) p = { Type: 'G4EllipticalTube', HLX: s.halfx, HLY: s.halfy, HLZ: s.halfz };
        else if ((shape === 'para' || shape === 'box') && s.halfx > 0) p = { Type: 'G4Para', HLX: s.halfx, HLY: s.halfy, HLZ: s.halfz, Alpha: s.paralp, Theta: s.parthe, Phi: s.parphi };
        if (p && Object.values(p).every(v => typeof v !== 'number' || isFinite(v))) pos = { kind: 'solid', p, matrix, surface: type === 'surface' };
        else warnings.push(`Source ${s.name}: ${s.posType} needs /gps/pos/shape and its size; showing the centre`);
      } else if (type !== 'point') {
        warnings.push(`Source ${s.name}: /gps/pos/type ${s.posType} isn't drawn; showing the centre`);
      }

      const ang = s.angType.toLowerCase();
      const angFrame = s.userAngRef ? gpsFrame(s.angRot1, s.angRot2)
                     : (type === 'surface' || type === 'volume' ? frame.clone() : new THREE.Matrix4());
      let dir;
      if (ang === 'planar') dir = { kind: 'const', dir: s.direction.clone() };
      else if (ang === 'iso' || ang === 'cos') {
        const full = s.minTheta <= 0 && s.maxTheta >= Math.PI && s.minPhi <= 0 && s.maxPhi >= TWO_PI;
        dir = full ? { kind: 'iso' } : { kind: 'range', frame: angFrame, thetaMin: s.minTheta, thetaMax: s.maxTheta, phiMin: s.minPhi, phiMax: s.maxPhi };
      } else if (ang === 'beam1d' || ang === 'beam2d') {
        dir = { kind: 'const', dir: new THREE.Vector3(0, 0, -1).applyMatrix4(angFrame) };
      } else if (ang === 'focused') {
        dir = { kind: 'focus', point: s.focus.clone() };
      } else {
        warnings.push(`Source ${s.name}: /gps/ang/type ${s.angType} isn't drawn; showing isotropic`);
        dir = { kind: 'iso' };
      }
      return { name: s.name, label: `${s.name}: ${s.particle} ${s.energy}`, pos, dir, confine: s.confine };
    }

    // Attributes each solid accepts (for the click menu)

    function gdmlIndent(cm, index) {
      const pos = cm.posFromIndex(index);

    // Inserts { index, text } edits from last to first so indices stay valid
    function applyGdmlEdits(cm, edits) {
      edits.sort((a, b) => b.index - a.index).forEach(e => cm.replaceRange(e.text, cm.posFromIndex(e.index)));
    }

    function uniqueGdmlName(base, text) {
      let name = base, i = 2;
      while (text.includes(`name="${name}"`)) name = base + i++;
      return name;

    function insertGdmlSolid(tag) {
      const cm = geomEditor, text = cm.getValue();
      const solidsEnd = text.indexOf('</solids>'), structEnd = text.indexOf('</structure>');
      if (solidsEnd < 0 || structEnd < 0) { alert('The GDML needs <solids> and <structure> sections to add a solid.'); return; }
      showTab('geom');
      const name = uniqueGdmlName(tag.charAt(0).toUpperCase() + tag.slice(1), text);
      const ind = gdmlIndent(cm, solidsEnd) + '  ';
      const solidLines = [];
      const defineLines = [];
      if (tag === 'union' || tag === 'subtraction' || tag === 'intersection') {
        const a = uniqueGdmlName(name + 'A', text), b = uniqueGdmlName(name + 'B', text);
        solidLines.push(`<box name="${a}" x="60" y="60" z="60" lunit="mm"/>`, `<tube name="${b}" rmin="0" rmax="15" z="100" deltaphi="360" aunit="deg" lunit="mm"/>`,
          `<${tag} name="${name}">`, `  <first ref="${a}"/>`, `  <second ref="${b}"/>`,
          `  <position name="${name}_pos" x="0" y="0" z="30" unit="mm"/>`, `  <rotation name="${name}_rot" x="0" y="0" z="0" unit="deg"/>`, `</${tag}>`);
      } else if (tag === 'tet') {
        const v = [[0, 0, 17.3], [0, 16.3, -5.8], [-14.1, -8.2, -5.8], [14.1, -8.2, -5.8]];
        v.forEach((p, i) => defineLines.push(`<position name="${name}_v${i + 1}" x="${p[0]}" y="${p[1]}" z="${p[2]}" unit="mm"/>`));
        solidLines.push(`<tet name="${name}" vertex1="${name}_v1" vertex2="${name}_v2" vertex3="${name}_v3" vertex4="${name}_v4" lunit="mm"/>`);
      } else {
        const t = GDML_SOLID_TEMPLATES[tag];
        if (Array.isArray(t)) solidLines.push(`<${tag} name="${name}" ${t[0]}>`, ...t[1].map(l => '  ' + l), `</${tag}>`);
        else solidLines.push(`<${tag} name="${name}" ${t}/>`);
      }
      const edits = [{ index: text.lastIndexOf('\n', solidsEnd) + 1, text: solidLines.map(l => ind + l).join('\n') + '\n' }];
      if (defineLines.length) {
        const defEnd = text.indexOf('</define>');
        if (defEnd < 0) { alert('A <tet> needs a <define> section for its vertices.'); return; }
        const dInd = gdmlIndent(cm, defEnd) + '  ';
        edits.push({ index: text.lastIndexOf('\n', defEnd) + 1, text: defineLines.map(l => dInd + l).join('\n') + '\n' });
      }
      // new logical volume just before the world volume, placed inside the world
      const vol = uniqueGdmlName(name + 'Vol', text);
      const worldStart = text.search(new RegExp(`<volume\\s+name="${escapeRegExp(gdmlNames.world)}"`));
      const volInd = worldStart >= 0 ? gdmlIndent(cm, worldStart) : gdmlIndent(cm, structEnd) + '  ';
      const volumeBlock = [`<volume name="${vol}">`, `  <materialref ref="G4_WATER"/>`, `  <solidref ref="${name}"/>`,
                           `  <auxiliary auxtype="Color" auxvalue="${['lightblue', 'orange', 'lime', 'magenta', 'yellow', 'violet'][gdmlNames.volumes.length % 6]}"/>`,
                           `</volume>`].map(l => volInd + l).join('\n') + '\n';
      const volAt = worldStart >= 0 ? text.lastIndexOf('\n', worldStart) + 1 : text.lastIndexOf('\n', structEnd) + 1;
      edits.push({ index: volAt, text: volumeBlock });
      if (worldStart >= 0) {
        const worldEnd = text.indexOf('</volume>', worldStart);
        const pvInd = volInd + '  ';
        edits.push({ index: text.lastIndexOf('\n', worldEnd) + 1,
                     text: [`<physvol name="${vol}_pv">`, `  <volumeref ref="${vol}"/>`, `  <position name="${vol}_pos" x="0" y="0" z="0" unit="mm"/>`,
                            `</physvol>`].map(l => pvInd + l).join('\n') + '\n' });
      }
      applyGdmlEdits(cm, edits);
      const at = cm.getValue().indexOf(`name="${name}"`);
      if (at >= 0) cm.scrollIntoView(cm.posFromIndex(at), 120);
      updateGeometry();
    }

        `/gps/pos/confine ${gdmlNames.physvols[0] || '<physical_volume>'}`, '/gps/ang/type iso'],
      'Surface sphere, inward (cos)': ['/gps/particle gamma', '/gps/energy 1 MeV', '/gps/pos/type Surface', '/gps/pos/shape Sphere',
        '/gps/pos/centre 0 0 0 cm', '/gps/pos/radius 15 cm', '/gps/ang/type cos']
    };

    function insertGpsSource(label) {
      const t = GPS_SOURCE_TEMPLATES[label];
      const lines = typeof t === 'function' ? t() : [...t];
      if (/^\s*\/gps\//m.test(macroEditor.getValue())) lines.unshift('/gps/source/add 1');
      lines.unshift(`# ${label}`);
      appendLines(macroEditor, lines);
    }

    // --- click menu -------------------------------------------------------------------
    function gdmlGeomMenu(cm, lineNo) {
      const line = cm.getLine(lineNo);
      const m = line.match(/<\s*([A-Za-z]\w*)/);
      if (!m) return null;
      const tag = m[1];
      const groups = [];
      if (GDML_ATTRS[tag]) {
        const present = new Set([...line.matchAll(/([A-Za-z]\w*)\s*=/g)].map(x => x[1]));
        const items = GDML_ATTRS[tag].filter(a => !present.has(a)).map(a => ({ label: a, apply: () => {
          const text = cm.getLine(lineNo);
          let ch = text.lastIndexOf('/>');
          if (ch < 0) ch = text.lastIndexOf('>');
          if (ch < 0) ch = text.length;
          while (ch > 0 && text[ch - 1] === ' ') ch--;
          cm.replaceRange(` ${a}=""`, { line: lineNo, ch });
          cm.setCursor({ line: lineNo, ch: ch + a.length + 3 });
          cm.focus();
        } }));
        groups.push({ label: 'Attributes', items });
        if (['zplane', 'rzpoint', 'twoDimVertex', 'section'].includes(tag)) {
          const ind = (line.match(/^\s*/) || [''])[0];
          groups.push({ label: 'More', items: [{ label: `Another <${tag}>`, apply: () => {
            const n = insertLineAfter(cm, lineNo, `${ind}<${tag} ${GDML_ATTRS[tag].map(a => `${a}=""`).join(' ')}/>`);
            cm.setCursor({ line: n, ch: cm.getLine(n).indexOf('""') + 1 });
            cm.focus();
          } }] });
        }
        return { title: `<${tag}>`, groups };
      }
      const ind = (line.match(/^\s*/) || [''])[0];
      const blockEnd = closing => {
        for (let i = lineNo; i <= cm.lastLine(); i++) if (cm.getLine(i).includes(closing)) return i;
        return lineNo;
      };
      const insertBlock = (atLine, lines, cursorAttr) => () => {
        cm.replaceRange(lines.join('\n') + '\n', { line: atLine, ch: 0 });
        const n = atLine + lines.findIndex(l => l.includes(cursorAttr));
        const ch = cm.getLine(n).indexOf(cursorAttr) + cursorAttr.length;
        cm.setCursor({ line: n, ch });
        cm.focus();
      };
      if (tag === 'physvol') {
        const end = blockEnd('</physvol>');
        let block = '';
        for (let i = lineNo; i <= end; i++) block += cm.getLine(i);
        const items = [];
        if (!/<position/.test(block)) items.push({ label: '<position>', apply: insertBlock(lineNo + 1, [`${ind}  <position x="" y="" z="" unit="mm"/>`], 'x="') });
        if (!/<rotation/.test(block)) items.push({ label: '<rotation>', apply: insertBlock(lineNo + 1, [`${ind}  <rotation x="" y="" z="" unit="deg"/>`], 'x="') });
        if (!/copynumber=/.test(line)) items.push({ label: 'copynumber', apply: () => {
          const ch = line.lastIndexOf('>');
          cm.replaceRange(' copynumber=""', { line: lineNo, ch });
          cm.setCursor({ line: lineNo, ch: ch + 13 });
          cm.focus();
        } });
        return { title: '<physvol>', groups: [{ label: 'Add', items }] };
      }
      if (tag === 'volume' || tag === 'assembly') {
        const end = blockEnd(`</${tag}>`);
        let block = '';
        for (let i = lineNo; i <= end; i++) block += cm.getLine(i);
        const items = [{ label: 'Place a daughter (<physvol>)', apply: insertBlock(end, [`${ind}  <physvol name="">`, `${ind}    <volumeref ref=""/>`,
          `${ind}    <position x="" y="" z="" unit="mm"/>`, `${ind}  </physvol>`], 'ref="') }];
        if (tag === 'volume' && !/auxtype="Colou?r"/i.test(block)) {
          items.push({ label: 'Colour (<auxiliary>)', apply: insertBlock(lineNo + 1, [`${ind}  <auxiliary auxtype="Color" auxvalue=""/>`], 'auxvalue="') });
        }
        return { title: `<${tag}>`, groups: [{ label: 'Add', items }] };
      }
      return null;
    }

    const GPS_COMMANDS = {
      'Position': [['/gps/pos/type', '<Point|Plane|Beam|Surface|Volume>'], ['/gps/pos/shape', '<Circle|Annulus|Ellipse|Square|Rectangle|Sphere|Ellipsoid|Cylinder|Para>'],
        ['/gps/pos/centre', '<x> <y> <z> cm'], ['/gps/pos/radius', '<r> cm'], ['/gps/pos/radius0', '<r0> cm'], ['/gps/pos/halfx', '<hx> cm'],
        ['/gps/pos/halfy', '<hy> cm'], ['/gps/pos/halfz', '<hz> cm'], ['/gps/pos/sigma_r', '<sigma> cm'], ['/gps/pos/rot1', '<x> <y> <z>'],
        ['/gps/pos/rot2', '<x> <y> <z>'], ['/gps/pos/confine', '<physical_volume>']],
      'Direction': [['/gps/direction', '<x> <y> <z>'], ['/gps/ang/type', '<iso|cos|planar|beam1d|beam2d|focused>'], ['/gps/ang/mintheta', '<angle> deg'],
        ['/gps/ang/maxtheta', '<angle> deg'], ['/gps/ang/minphi', '<angle> deg'], ['/gps/ang/maxphi', '<angle> deg'], ['/gps/ang/sigma_r', '<angle> mrad'],
        ['/gps/ang/rot1', '<x> <y> <z>'], ['/gps/ang/rot2', '<x> <y> <z>'], ['/gps/ang/focuspoint', '<x> <y> <z> cm']],
      'Particle & energy': [['/gps/particle', '<particle>'], ['/gps/energy', '<E> MeV']]
    };

    function gpsMacroMenu(cm, lineNo) {
      if (!/^\s*\/gps\//.test(cm.getLine(lineNo))) return null;
      // the source block: from the last /gps/source/add at or above this line to the next one
      let start = 0, end = cm.lastLine();
      for (let i = lineNo; i >= 0; i--) if (/^\s*\/gps\/source\/add/.test(cm.getLine(i))) { start = i; break; }
      for (let i = lineNo + 1; i <= cm.lastLine(); i++) if (/^\s*\/gps\/source\/add/.test(cm.getLine(i))) { end = i - 1; break; }
      const present = new Set();
      let last = lineNo;
      for (let i = start; i <= end; i++) {
        const t = cm.getLine(i).trim().split(/\s+/)[0];
        if (/^\/gps\//.test(t)) { present.add(t.toLowerCase()); last = i; }
      }
      const groups = Object.entries(GPS_COMMANDS).map(([label, cmds]) => ({
        label,
        items: cmds.filter(([c]) => !present.has(c)).map(([c, args]) => ({
          label: c.replace('/gps/', ''), apply: () => focusPlaceholder(cm, insertLineAfter(cm, last, `${c} ${args}`)) }))
      }));
      return { title: 'This source', groups };
    }

    const FORMAT = {
      geomMode: 'xml',
      geomFileName: 'geometry.gdml',
      macroFileName: 'run.mac',
      isGeometryFile: n => /\.(gdml|xml)$/i.test(n),
      defaultGeom: `<?xml version="1.0" encoding="UTF-8"?>
<gdml xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://service-spi.web.cern.ch/service-spi/app/releases/GDML/schema/gdml.xsd">
  <define>
    <position name="center" x="0" y="0" z="0" unit="mm"/>
  </define>

  <materials/>

  <solids>
    <box name="WorldBox" x="1000" y="1000" z="1000" lunit="mm"/>
    <box name="PhantomBox" x="240" y="240" z="180" lunit="mm"/>
    <tube name="ApplicatorTube" rmin="20" rmax="42" z="180" startphi="0" deltaphi="360" aunit="deg" lunit="mm"/>
  </solids>

  <structure>
    <volume name="Phantom">
      <materialref ref="G4_WATER"/>
      <solidref ref="PhantomBox"/>
      <auxiliary auxtype="Color" auxvalue="#4169e1"/>
    </volume>
    <volume name="Applicator">
      <materialref ref="G4_PLEXIGLASS"/>
      <solidref ref="ApplicatorTube"/>
    </volume>
    <volume name="World">
      <materialref ref="G4_AIR"/>
      <solidref ref="WorldBox"/>
      <physvol name="Phantom_pv">
        <volumeref ref="Phantom"/>
        <positionref ref="center"/>
      </physvol>
      <physvol name="Applicator_pv">
        <volumeref ref="Applicator"/>
        <position name="applicatorPos" x="0" y="0" z="200" unit="mm"/>
      </physvol>
    </volume>
  </structure>

  <setup name="Default" version="1.0">
    <world ref="World"/>
  </setup>
</gdml>
`,
      defaultMacro: `# Geant4 General Particle Source (lengths default to cm, angles to rad)
/gps/particle e-
/gps/energy 6 MeV
/gps/pos/type Plane
/gps/pos/shape Circle
/gps/pos/centre 0 0 40 cm
/gps/pos/radius 2 cm
/gps/direction 0 0 -1
`,
      parse(geomText, macroText) {
        const warnings = [], errors = [];
        const geometry = parseGDML(geomText, warnings, errors);
        const sources = parseGPS(macroText, warnings, errors);
        return { geometry, sources, warnings, errors };
      },
      addGroups() {
        return [
          { label: 'Solids', items: Object.keys(GDML_SOLID_TEMPLATES).map(t => ({ label: t, apply: () => insertGdmlSolid(t) })) },
          { label: 'Sources (GPS)', items: Object.keys(GPS_SOURCE_TEMPLATES).map(l => ({ label: l, apply: () => insertGpsSource(l) })) }
        ];
      },
      menuFor(which, cm, line) {
        return which === 'geom' ? gdmlGeomMenu(cm, line) : gpsMacroMenu(cm, line);
      }
    };

  </script>
