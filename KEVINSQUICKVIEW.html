      groups.forEach(g => g.traverseVisible(o => {
        if (!o.isMesh || (o.material && o.material.visible === false)) return;
        if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
        box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
      }));
      return box;
    }

    function fitToView(){
      const box = visibleBounds([geometryGroup, stlGroup, beamGroup]);
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.75 + 1;

      camera.position.set(center.x + dist, center.y + dist*0.8, center.z + dist);
      controls.target.copy(center);
      controls.update();
    }

    // Screen axes: up = TOPAS +Z, right = TOPAS +X, toward the viewer = TOPAS -Y
    function setNamedView(name){
      let box = visibleBounds([geometryGroup, stlGroup]);
      if (box.isEmpty()) box = new THREE.Box3(new THREE.Vector3(-100, -100, -100), new THREE.Vector3(100, 100, 100));
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const d = Math.max(size.x, size.y, size.z) * 1.4 + 1;

      if (name==='top') camera.position.set(center.x, center.y + d, center.z + d * 1e-3);
      else if (name==='front') camera.position.set(center.x, center.y, center.z + d);
      else if (name==='right') camera.position.set(center.x + d, center.y, center.z);
      else camera.position.set(center.x + d, center.y + d*0.8, center.z + d);

      controls.target.copy(center);
      controls.update();
    }

    function applyWireframe(){
      geometryGroup.traverse(o=>{
        if (o.isMesh){
          o.material.wireframe = wireframeMode || !!o.userData.wire;
          o.material.opacity = currentOpacity;
          o.material.needsUpdate = true;
        }
      });
      stlGroup.traverse(o => {
        if (o.isMesh) {
          o.material.wireframe = wireframeMode;
          o.material.needsUpdate = true;
        }
      });
    }

    const SHAPE_COLORS = ['lightblue', 'orange', 'grass', 'magenta', 'yellow', 'violet', 'skyblue', 'pink', 'red', 'turquoise'];

    // Source templates (parameter names from the TOPAS examples). Sources that need a place or a
    // volume get their own component; beam-like ones use TOPAS's BeamPosition.
    const SOURCE_TEMPLATES = {
      Beam: { params: ['s:BeamParticle = "proton"', 'd:BeamEnergy = 150 MeV', 'u:BeamEnergySpread = 0.757504',
        's:BeamPositionDistribution = "Gaussian"', 's:BeamPositionCutoffShape = "Ellipse"',
        'd:BeamPositionCutoffX = 10 mm', 'd:BeamPositionCutoffY = 10 mm',
        'd:BeamPositionSpreadX = 3 mm', 'd:BeamPositionSpreadY = 3 mm',
        's:BeamAngularDistribution = "Gaussian"', 'd:BeamAngularCutoffX = 90 deg', 'd:BeamAngularCutoffY = 90 deg',
        'd:BeamAngularSpreadX = 0.0032 rad', 'd:BeamAngularSpreadY = 0.0032 rad', 'i:NumberOfHistoriesInRun = 100'] },
      PhaseSpace: { params: ['s:PhaseSpaceFileName = ""', 'i:PhaseSpaceMultipleUse = 0',
        'b:PhaseSpaceIncludeEmptyHistories = "False"', 'b:PhaseSpacePreCheck = "True"'] },
      Emittance: { params: ['s:BeamParticle = "proton"', 'd:BeamEnergy = 94 MeV', 'u:BeamEnergySpread = 1.0',
        's:Distribution = "BiGaussian"', 'd:SigmaX = 2.0 mm', 'u:SigmaXprime = 0.0032', 'u:CorrelationX = -0.8',
        'd:SigmaY = 2.0 mm', 'u:SigmaYPrime = 0.0032', 'u:CorrelationY = 0.4', 'i:NumberOfHistoriesInRun = 100'] },
      Isotropic: { volume: 'Group', params: ['s:BeamParticle = "gamma"', 'd:BeamEnergy = 100 keV',
        'u:BeamEnergySpread = 0', 'i:NumberOfHistoriesInRun = 100'] },
      Distributed: { volume: 'TsSphere', params: ['s:BeamParticle = "gamma"', 'd:BeamEnergy = 10 keV',
        'u:BeamEnergySpread = 0', 'i:NumberOfSourcePoints = 100', 's:PointDistribution = "Flat"',
        'b:RedistributePointsOnNewRun = "False"', 'i:NumberOfHistoriesInRun = 100'] },
      Volumetric: { volume: 'TsCylinder', params: ['s:ActiveMaterial = "G4_WATER"', 's:BeamParticle = "e-"',
        'd:BeamEnergy = 1 MeV', 'u:BeamEnergySpread = 0', 'b:RecursivelyIncludeChildren = "True"',
        'i:MaxNumberOfPointsToSample = 1000000', 'i:NumberOfHistoriesInRun = 100'] },
      Environment: { volume: 'TsBox', params: ['s:BeamParticle = "proton"', 'd:BeamEnergy = 200 MeV',
        'i:NumberOfHistoriesInRun = 100'] },
    };

    function uniqueName(base, taken) {
      let name = base, i = 2;
      while (taken[name]) name = base + i++;
      return name;
    }

    // "d:HLX = 30 mm" style template -> full parameter line
    function templateLine(category, owner, t) {
      const [, prefix, prop, value] = t.match(/^(\w+):(\w+)\s*=\s*(.*)$/);
      return `${prefix}:${category}/${owner}/${prop.padEnd(12)} = ${value}`;
    }

    function componentBlock(type, name) {
      const line = (prefix, prop, value) => `${prefix}:Ge/${name}/${prop.padEnd(12)} = ${value}`;
      const color = SHAPE_COLORS[Object.keys(parsedGeometry).length % SHAPE_COLORS.length];
      return [
        line('s', 'Type', `"${type}"`),
        line('s', 'Parent', '"World"'),
        ...(type === 'Group' ? [] : [line('s', 'Material', '"G4_WATER"')]),
        ...['TransX', 'TransY', 'TransZ'].map(t => line('d', t, '0 mm')),
        ...['RotX', 'RotY', 'RotZ'].map(r => line('d', r, '0 deg')),
        ...(SHAPES[type] ? SHAPES[type].tpl.map(t => templateLine('Ge', name, t)) : []),
        ...(type === 'Group' ? [] : [line('s', 'Color', `"${color}"`)])
      ];
    }

    function appendBlock(lines) {
      const lastLine = editor.lastLine();
      const text = (editor.getLine(lastLine).trim() ? '\n\n' : '\n') + lines.join('\n') + '\n';
      editor.replaceRange(text, { line: lastLine, ch: editor.getLine(lastLine).length });
      editor.scrollIntoView({ line: editor.lastLine(), ch: 0 });
      updateGeometry();
    }

    function insertShapeTemplate(type) {
      const name = uniqueName(type.replace(/^(Ts|G4)/, ''), parsedGeometry);
      appendBlock([`# ${type}`, ...componentBlock(type, name)]);
    }

    function insertSourceTemplate(type) {
      const t = SOURCE_TEMPLATES[type];
      const name = uniqueName(type + 'Source', parsedSources);
      const lines = [`# ${type} source`];
      let comp = 'BeamPosition';
      if (t.volume) {
        comp = uniqueName(name + (t.volume === 'Group' ? 'Position' : 'Volume'), parsedGeometry);
        lines.push(...componentBlock(t.volume, comp), '');
      }
      const line = (prefix, prop, value) => `${prefix}:So/${name}/${prop.padEnd(12)} = ${value}`;
      lines.push(line('s', 'Type', `"${type}"`), line('s', 'Component', `"${comp}"`),
                 ...t.params.map(p => templateLine('So', name, p)));
      appendBlock(lines);
    }

    function debounce(fn, ms){
      let t;
      return (...args)=>{
        clearTimeout(t);
        t=setTimeout(()=>fn.apply(null,args), ms);
      };
    }

    // ---------------------------------------------------------------------------------
    // Parameter menu: click a Ge/<Component>/... line to add that component's missing
    // parameters, written in with the value left blank.
    // ---------------------------------------------------------------------------------
    const PLACEMENT_SPECS = {
      'Translation': ['d:TransX mm', 'd:TransY mm', 'd:TransZ mm'],
      'Rotation': ['d:RotX deg', 'd:RotY deg', 'd:RotZ deg'],
      'Other': ['s:Parent', 's:Material', 's:Color', 's:DrawingStyle', 'b:Invisible']
    };
    const CAD_SPECS = ['s:InputFile', 's:FileFormat', 'd:Units mm'];

    function parseSpec(spec) {
      const [, prefix, name, unit] = spec.match(/^(\w+):(\w+)(?:\s+(\S+))?$/);
      return { prefix, name, unit: unit || '' };
    }

    // "d:HLX = 30 mm" -> { prefix: 'd', name: 'HLX', unit: 'mm' }
    function specFromTemplate(t) {
      const [, prefix, name, value] = t.match(/^(\w+):(\w+)\s*=\s*(.*)$/);
      const last = value.trim().split(/\s+/).pop();
      return { prefix, name, unit: /^[a-z]+$/i.test(last) ? last : '' };
    }

    function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // Scan the editor text for one component: which parameters it sets, its Type, and its last line
    function scanComponent(comp) {
      const re = new RegExp('^\\s*\\w+:\\s*Ge/' + escapeRegExp(comp) + '/([^/=\\s]+)\\s*=\\s*(.*)$', 'i');
      const props = new Set();
      let type = null, lastLine = -1;
      editor.eachLine(h => {
        const m = stripComment(h.text).match(re);
        if (!m) return;
        props.add(m[1].toLowerCase());
        lastLine = editor.getLineNumber(h);
        if (m[1].toLowerCase() === 'type') {
          const q = m[2].match(/"([^"]*)"/);
          if (q) type = normalizeType(q[1]);
        }
      });
      return { props, type, lastLine };
    }

    function paramGroupsFor(type) {
      const groups = [];
      if (!type) {
        groups.push({ label: 'Type', items: [...Object.keys(SHAPES), 'Group', 'TsCAD']
          .map(t => ({ prefix: 's', name: 'Type', unit: '', value: t })) });
      } else if (SHAPES[type]) {
        groups.push({ label: `Size / shape (${type})`, items: SHAPES[type].tpl.map(specFromTemplate) });
      } else if (type === 'TsCAD') {
        groups.push({ label: 'CAD file', items: CAD_SPECS.map(parseSpec) });
      }
      for (const [label, specs] of Object.entries(PLACEMENT_SPECS)) {
        groups.push({ label, items: specs.map(parseSpec) });
      }
      return groups;
    }

    // Line text for a parameter with a blank value, plus where the cursor goes
    function blankParamLine(comp, item) {
      const head = `${item.prefix}:Ge/${comp}/${item.name} = `;
      if (item.value) return { text: `${head}"${item.value}"`, ch: head.length + item.value.length + 2 };
      if (item.prefix === 's' || item.prefix === 'b') return { text: `${head}""`, ch: head.length + 1 };
      if (item.unit) return { text: `${head} ${item.unit}`, ch: head.length };
      return { text: head, ch: head.length };
    }

    let paramMenuItems = [];
    let paramMenuComp = null;

    function hideParamMenu() {
      document.getElementById('paramMenu').style.display = 'none';
      paramMenuComp = null;
    }

    function showParamMenu() {
      if (editor.somethingSelected()) return hideParamMenu();
      const cur = editor.getCursor();
      const m = stripComment(editor.getLine(cur.line)).match(/^\s*[A-Za-z]{1,3}:\s*Ge\/(\S+)\/[^\/=\s]+\s*=/);
      if (!m) return hideParamMenu();
      const comp = m[1];
      const { props, type } = scanComponent(comp);

      const list = document.getElementById('paramMenuList');
      list.innerHTML = '';
      paramMenuItems = [];
      let rows = 0;
      for (const group of paramGroupsFor(type)) {
        const items = group.items.filter(it => it.value || !props.has(it.name.toLowerCase()));
        if (!items.length) continue;
        const og = document.createElement('optgroup');
        og.label = group.label;
        for (const it of items) {
          const opt = document.createElement('option');
          opt.value = String(paramMenuItems.length);
          opt.textContent = it.value ? it.value : `${it.name}${it.unit ? '  (' + it.unit + ')' : ''}`;
          og.appendChild(opt);
          paramMenuItems.push(it);
        }
        list.appendChild(og);
        rows += items.length + 1;
      }
      if (!paramMenuItems.length) return hideParamMenu();
      list.size = Math.min(rows, 14);
      list.selectedIndex = -1;

      paramMenuComp = comp;
      document.getElementById('paramMenuTitle').textContent = `Add to ${comp}${type ? ' (' + type + ')' : ''}`;
      const menu = document.getElementById('paramMenu');
      menu.style.display = 'block';
      const coords = editor.cursorCoords(cur, 'window');
      const w = menu.offsetWidth, h = menu.offsetHeight;
      const left = Math.min(coords.left, window.innerWidth - w - 8);
      const top = coords.bottom + 4 + h > window.innerHeight ? coords.top - h - 4 : coords.bottom + 4;
      menu.style.left = Math.max(8, left) + 'px';
      menu.style.top = Math.max(8, top) + 'px';
    }

    function insertParam(item) {
      const comp = paramMenuComp;
      hideParamMenu();
      if (!comp) return;
      const { lastLine } = scanComponent(comp);
      const { text, ch } = blankParamLine(comp, item);
      const at = lastLine >= 0 ? lastLine : editor.getCursor().line;
      editor.replaceRange('\n' + text, { line: at, ch: editor.getLine(at).length });
      editor.setCursor({ line: at + 1, ch });
      editor.focus();
    }

    function initParamMenu() {
      editor.getWrapperElement().addEventListener('click', showParamMenu);
      editor.on('keydown', hideParamMenu);
      editor.on('scroll', hideParamMenu);
      document.addEventListener('mousedown', e => {
        if (!document.getElementById('paramMenu').contains(e.target)) hideParamMenu();
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') hideParamMenu(); });
      document.getElementById('paramMenuList').addEventListener('change', e => {
        const item = paramMenuItems[parseInt(e.target.value, 10)];
        if (item) insertParam(item);
      });
    }

    function updateGeometry(){
      const text = editor.getValue();
      const result = parseTopasGeometry(text);
      const sceneResult = populateScene(result);
      renderWarnings(sceneResult.warnings, sceneResult.errors);
    }

    window.addEventListener('load', ()=>{
      initThree();
      initEditor();
      initParamMenu();
      updateGeometry();

      document.getElementById('btnUpdate').onclick = updateGeometry;

      document.getElementById('btnDownload').onclick = () => {
        const text = editor.getValue();
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const element = document.createElement('a');
        element.href = URL.createObjectURL(blob);
        element.download = "topas_quickview_config.txt";
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
      };

      document.getElementById('btnFit').onclick = fitToView;
      document.getElementById('btnReset').onclick = ()=>{
        camera.position.set(300,240,300);
        controls.target.set(0,0,0);
        controls.update();
      };
      document.getElementById('btnWire').onclick = ()=>{
        wireframeMode=!wireframeMode;
        applyWireframe();
      };
      document.getElementById('btnAxes').onclick = ()=>{
        showAxes=!showAxes;
        axesHelper.visible=showAxes;
      };
      document.getElementById('opacity').oninput = (e)=>{
        currentOpacity = parseFloat(e.target.value);
        applyWireframe();
      };
      document.getElementById('beamRadius').oninput = (e) => {
        currentBeamRadius = parseFloat(e.target.value) || 30;
        drawSources(parsedSources, parsedGeometry);
      };
      document.getElementById('rotConv').onchange = (e) => {
        rotConvention = e.target.value;
        updateGeometry();
      };

      const shapeSelect = document.getElementById('shapeInsert');
      [['Shapes', 'shape', Object.keys(SHAPES)], ['Sources', 'source', Object.keys(SOURCE_TEMPLATES)]].forEach(([label, kind, types]) => {
        const group = document.createElement('optgroup');
        group.label = label;
        types.forEach(type => {
          const opt = document.createElement('option');
          opt.value = `${kind}:${type}`;
          opt.textContent = type;
          group.appendChild(opt);
        });
        shapeSelect.appendChild(group);
      });
      shapeSelect.onchange = (e) => {
        const [kind, type] = e.target.value.split(':');
        if (kind === 'shape') insertShapeTemplate(type);
        else if (kind === 'source') insertSourceTemplate(type);
        e.target.value = '';
      };

      document.getElementById('btnLoadSTL').onclick = () => {
        document.getElementById('stlFileInput').click();
      };
      document.getElementById('stlFileInput').onchange = (e) => {
        if (e.target.files.length > 0) {
          handleSTLFiles(e.target.files);
        }
        e.target.value = '';
      };
      document.getElementById('btnClearSTL').onclick = clearSTLs;

      document.querySelectorAll('.controls [data-view]').forEach(btn=>
        btn.addEventListener('click', ()=> setNamedView(btn.getAttribute('data-view')))
      );
    });
  </script>
